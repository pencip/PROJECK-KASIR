<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-include" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-extend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#c05621" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- SYSTEM BOUNDARY -->
  <rect x="220" y="35" width="650" height="690" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2" filter="url(#shadow)"/>
  <rect x="220" y="35" width="650" height="38" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <rect x="220" y="63" width="650" height="10" fill="#e9ecef"/>
  <line x1="220" y1="73" x2="870" y2="73" stroke="#495057" stroke-width="1.5"/>
  <text x="545" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#212529">Sistem POS Restoran</text>

  <!-- AKTOR KASIR (Kiri) -->
  <g transform="translate(60, 230)">
    <circle cx="30" cy="20" r="14" fill="#d5e8d4" stroke="#276749" stroke-width="2.2"/>
    <line x1="30" y1="34" x2="30" y2="70" stroke="#276749" stroke-width="2.5"/>
    <line x1="10" y1="48" x2="50" y2="48" stroke="#276749" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="12" y2="105" stroke="#276749" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="48" y2="105" stroke="#276749" stroke-width="2.5"/>
    <text x="30" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Kasir</text>
  </g>

  <!-- AKTOR MANAJER (Kanan Atas) -->
  <g transform="translate(930, 150)">
    <circle cx="30" cy="20" r="14" fill="#ffe6cc" stroke="#b7791f" stroke-width="2.2"/>
    <line x1="30" y1="34" x2="30" y2="70" stroke="#b7791f" stroke-width="2.5"/>
    <line x1="10" y1="48" x2="50" y2="48" stroke="#b7791f" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="12" y2="105" stroke="#b7791f" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="48" y2="105" stroke="#b7791f" stroke-width="2.5"/>
    <text x="30" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a202c">Manajer</text>
  </g>

  <!-- AKTOR ADMINISTRATOR (Kanan Bawah) -->
  <g transform="translate(930, 500)">
    <circle cx="30" cy="20" r="14" fill="#fed7d7" stroke="#9b2c2c" stroke-width="2.2"/>
    <line x1="30" y1="34" x2="30" y2="70" stroke="#9b2c2c" stroke-width="2.5"/>
    <line x1="10" y1="48" x2="50" y2="48" stroke="#9b2c2c" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="12" y2="105" stroke="#9b2c2c" stroke-width="2.5"/>
    <line x1="30" y1="70" x2="48" y2="105" stroke="#9b2c2c" stroke-width="2.5"/>
    <text x="30" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Administrator</text>
  </g>

  <!-- GARIS ASOSIASI (Solid) -->
  <!-- Kasir -> Login -->
  <line x1="110" y1="260" x2="445" y2="120" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Kasir -> Transaksi -->
  <line x1="115" y1="280" x2="250" y2="245" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Manajer -> Login -->
  <line x1="935" y1="180" x2="625" y2="120" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Manajer -> Dashboard -->
  <line x1="935" y1="200" x2="825" y2="240" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Admin -> Login -->
  <line x1="935" y1="520" x2="635" y2="135" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Admin -> Dashboard -->
  <line x1="935" y1="535" x2="820" y2="260" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Admin -> Menu -->
  <line x1="935" y1="550" x2="550" y2="550" stroke="#2d3748" stroke-width="1.8"/>
  <!-- Admin -> User -->
  <line x1="935" y1="565" x2="810" y2="565" stroke="#2d3748" stroke-width="1.8"/>

  <!-- USE CASE 1: Login -->
  <g transform="translate(445, 95)">
    <ellipse cx="90" cy="27" rx="90" ry="27" fill="#e9d8fd" stroke="#6b46c1" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#44337a">Login</text>
  </g>

  <!-- USE CASE 2: Memproses Transaksi Penjualan -->
  <g transform="translate(250, 215)">
    <ellipse cx="100" cy="32" rx="100" ry="32" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">Memproses Transaksi</text>
    <text x="100" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">Penjualan</text>
  </g>

  <!-- USE CASE 3: Memilih Metode Bayar -->
  <g transform="translate(250, 365)">
    <ellipse cx="95" cy="30" rx="95" ry="30" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5282">Memilih Metode Bayar</text>
    <text x="95" y="42" text-anchor="middle" font-size="11" font-style="italic" fill="#4a5568">(Tunai / QRIS)</text>
  </g>

  <!-- USE CASE 4: Cetak Struk -->
  <g transform="translate(470, 280)">
    <ellipse cx="75" cy="27" rx="75" ry="27" fill="#fefcbf" stroke="#d69e2e" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#744210">Cetak Struk</text>
  </g>

  <!-- USE CASE 5: Dashboard Analitik & Omzet -->
  <g transform="translate(630, 215)">
    <ellipse cx="100" cy="32" rx="100" ry="32" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="27" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">Melihat Dashboard</text>
    <text x="100" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5282">Analitik &amp; Omzet</text>
  </g>

  <!-- USE CASE 6: Filter Laporan Riwayat Transaksi -->
  <g transform="translate(640, 345)">
    <ellipse cx="90" cy="28" rx="90" ry="28" fill="#fefcbf" stroke="#d69e2e" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#744210">Memfilter Riwayat</text>
    <text x="90" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#744210">Transaksi</text>
  </g>

  <!-- USE CASE 7: Mengelola Menu (Admin) -->
  <g transform="translate(340, 520)">
    <ellipse cx="105" cy="32" rx="105" ry="32" fill="#f0fff4" stroke="#276749" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">Mengelola Data Menu</text>
    <text x="105" y="44" text-anchor="middle" font-size="11" fill="#276749">(Katalog &amp; Stok)</text>
  </g>

  <!-- USE CASE 8: Mengelola Pengguna (Admin) -->
  <g transform="translate(600, 520)">
    <ellipse cx="105" cy="32" rx="105" ry="32" fill="#f0fff4" stroke="#276749" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="27" text-anchor="middle" font-size="12" font-weight="bold" fill="#22543d">Mengelola Pengguna</text>
    <text x="105" y="44" text-anchor="middle" font-size="11" fill="#276749">&amp; Hak Akses</text>
  </g>

  <!-- RELASI <<include>> Transaksi -> Login -->
  <path d="M 380 215 Q 405 170 460 145" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-include)"/>
  <rect x="385" y="165" width="70" height="18" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="420" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">&lt;&lt;include&gt;&gt;</text>

  <!-- RELASI <<include>> Transaksi -> Bayar -->
  <path d="M 345 280 L 345 365" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-include)"/>
  <rect x="310" y="315" width="70" height="18" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="345" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">&lt;&lt;include&gt;&gt;</text>

  <!-- RELASI <<include>> Dashboard -> Login -->
  <path d="M 700 215 Q 670 170 610 145" fill="none" stroke="#555555" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-include)"/>
  <rect x="625" y="165" width="70" height="18" rx="4" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="660" y="178" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">&lt;&lt;include&gt;&gt;</text>

  <!-- RELASI <<extend>> Struk -> Transaksi -->
  <path d="M 470 295 Q 440 280 430 265" fill="none" stroke="#c05621" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-extend)"/>
  <rect x="425" y="270" width="65" height="18" rx="4" fill="#ffffff" stroke="#fbd38d" stroke-width="1"/>
  <text x="457" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#c05621">&lt;&lt;extend&gt;&gt;</text>

  <!-- RELASI <<extend>> Filter Laporan -> Dashboard -->
  <path d="M 730 345 L 730 285" fill="none" stroke="#c05621" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-extend)"/>
  <rect x="695" y="305" width="65" height="18" rx="4" fill="#ffffff" stroke="#fbd38d" stroke-width="1"/>
  <text x="727" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#c05621">&lt;&lt;extend&gt;&gt;</text>

</svg>